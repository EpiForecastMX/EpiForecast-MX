  infecciosas_respiratorias_neumonias:
    # Neumonías y bronconeumonías (J12-J18 excepto J18.2, J13 y J14; hasta 2024 «J12, J15-J18
    # excepto J18.2», el mismo conjunto). Discovery del 10-nov-2026 sobre 670 boletines: la página
    # con «bronconeumon» y entidades es el Cuadro 5.1 hasta 2024_sem06 (527 boletines) y el 5.2
    # desde 2024_sem07 (142). En el 5.1 es el segundo bloque, tras IRA: último de 8 columnas hasta
    # 2020_sem07, intermedio antes de Covid-19 con 11 (2020) o 12. En el 5.2 es el primero de 8,
    # antes de Covid-19: el mismo ancho que antes de 2020 en otra posición, por eso el periodo.
