  cuadro_6_sifilis_adquirida:
    # CUADRO 6 «Casos por entidad federativa de Enfermedades de Transmisión Sexual»:
    # Sífilis congénita (A50, 4 col), Sífilis adquirida (A51-A53, 4 col) e Infección gonocócica
    # del tracto genitourinario (A54.0-A54.2, 4 col). Medido en los 670 boletines (2014-2026):
    # rezago impreso 1 para Sífilis adquirida (desde 2021_sem01 A50 pasa a rezago 0).
    # Anclas sin «a51-a53» completo porque pypdf separa «A51 -A53» con espacio en 2014_sem01/02.
    # Reparaciones opt-in medidas sobre los 27 boletines no leídos con la configuración inicial:
    #   1) En 15 boletines (2025_sem01..02, 04..09 y 2026_sem01..07) camelot con row_tol=2 separa
    #      valores y nombres en dos renglones y deja 32 filas vacías; reintento_row_tol: 4 recupera
    #      las 32 filas y 12 columnas cuadrando con el TOTAL impreso (sin tocar los 641 ya válidos).
    #   2) En 12 boletines (2025_sem12, 25, 28, 31 y 2026_sem08, 09, 10, 17, 20, 23, 34, 42) el PDF
    #      sí imprime las 12 columnas visualmente, pero la columna Acum. año anterior de A51-A53
    #      está incrustada como imágenes de celda sin capa de texto: camelot/pdftotext ven 11
    #      columnas de texto (4 A50 + 3 A51 [Sem, H, M] + 4 A54). bloque_sin_prev_en_capa_texto
    #      verifica el TOTAL de 11 columnas y la geometría de imágenes en esa banda antes de emitir
    #      3col_noprev con Acumulado_anio_anterior = NA explícito (nunca 0 ni fuente declarada vacía).
    page_anchors: ["adquirida", "gonoc", "a51"]
    state_markers: ["zacatecas", "tamaulipas"]
    year_week_source: filename
    observation_lag_weeks: 1
    reintento_row_tol: 4
    inner_block_columns: {12: [8, 4]}
