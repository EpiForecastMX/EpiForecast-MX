# ─────────────────────────────────────────────────────────────────────────────
# Grupos de cuadro para extracción genérica (EPIC 2). SOLO describe layouts/bloques;
# referencia el padecimiento por id del registry (config/padecimientos.yaml), sin
# duplicar nombre ni CIE. Cargado por src/epiforecast/data/extraction/cuadro_registry.py
# ─────────────────────────────────────────────────────────────────────────────
version: 1

cuadro_groups:
  trastornos_nutricion:
    # CUADRO 14.1 "Casos por entidad federativa de Trastornos de la Nutrición".
    # Anclas de página (todas presentes) + marcadores de estado (distingue la tabla
    # estatal del resumen nacional). Título NO se usa (typo "Transtornos" en la fuente).
    page_anchors: ["e66", "obesidad"]
    state_markers: ["aguascalientes", "zacatecas"]
    year_week_source: filename
    # Retraso de observación del boletín (EpiDatasetV2): la (año,semana) de FUENTE se
    # desplaza este número de semanas hacia atrás en el calendario epidemiológico.
    observation_lag_weeks: 1
    # Padecimientos co-ubicados (izq->der). onboard:false = extraíble pero no se emite.
    diseases:
      - id: obesidad
        keyword: "Obesidad"
        block_index: 0
        onboard: true
      - id: anorexia_f50
        keyword: "Anorexia_F50"
        block_index: 1
        onboard: true
    # Variantes de layout (columnas por padecimiento). Frontera verificada por discovery:
    # 3col (Sem, H, M) hasta 2015_sem01; 4col (+ año anterior) desde 2015_sem02.
    layout_variants:
      - id: v_4col_prev
        min_year_week: "2015_sem02"   # >= esta clave -> 4 columnas
        cols_per_disease: 4
        has_prev_year: true
      - id: v_3col_noprev
        min_year_week: "0000_sem00"   # anterior -> 3 columnas (se rellena año anterior con NA)
        cols_per_disease: 3
        has_prev_year: false
    n_states_expected: 32
    backend: camelot_stream            # pdfplumber-por-posición aplazado (sin fixture que falle)

  enfermedades_respiratorias:
    # CUADRO 5.1/5.2 "Enfermedades Infecciosas del Aparato Respiratorio": Covid-19 U07.1 por estado
    # y sexo desde 2020_sem08. Es siempre el ÚLTIMO bloque, con formatos distintos: 3 columnas en
    # 2020 (sin año anterior) tras dos bloques de 4 (11 en total), 4 tras dos bloques en 2021-2024
    # (12) y 4 tras uno desde 2024_sem07 (8). Discovery del 6-nov-2026 sobre 408 boletines.
    page_anchors: ["u07.1"]
    state_markers: ["zacatecas", "tamaulipas"]
    year_week_source: filename
    observation_lag_weeks: 0           # el título dice «Covid 19 hasta la N» en el boletín N
    last_block_columns: {11: 3, 12: 4, 8: 4}
    diseases:
      - id: covid_19
        keyword: "Covid_19"
        block_index: 0
        onboard: true
    layout_variants:
      - id: v_4col_prev
        min_year_week: "2021_sem01"
        cols_per_disease: 4
        has_prev_year: true
      - id: v_3col_noprev
        min_year_week: "0000_sem00"
        cols_per_disease: 3
        has_prev_year: false
    n_states_expected: 32
    backend: camelot_stream

  enfermedades_no_transmisibles:
    # CUADRO 13 "Casos por entidad federativa de Enfermedades No Transmisibles": Bocio E01,
    # Diabetes tipo I E10 y Diabetes tipo II E11-E14. Discovery 2026-10-17 sobre 658 boletines:
    # 4 columnas por bloque (Sem, Acum H, Acum M, Acum año anterior) desde 2014_sem02; en 648
    # boletines con renglón TOTAL legible la suma de los 32 estados cuadra exacto con él.
    # Anclas: 2014 no imprime los códigos E10/E11-E14, así que se ancla por nombre. Marcadores
    # sin "aguascalientes" ni "veracruz": pypdf los parte en 2018_sem48 y en 2014-2016.
    page_anchors: ["bocio", "diabetes"]
    state_markers: ["zacatecas", "tamaulipas"]
    year_week_source: filename
    observation_lag_weeks: 1           # "hasta la semana N" en el boletín N+1, igual que 14.1
    diseases:
      - id: bocio_e01
        keyword: "Bocio_E01"
        block_index: 0
        onboard: false
      - id: diabetes_t1
        keyword: "Diabetes_T1"
        block_index: 1
        onboard: true
      - id: diabetes_t2
        keyword: "Diabetes_T2"
        block_index: 2
        onboard: true
    # Erratas de FUENTE: el boletín se descarta para los padecimientos listados (nunca se corrige
    # a mano). keep_period: true emite el periodo con valores vacíos para que la reconciliación lo
    # impute causalmente (flag total_imputed) y la serie siga contigua; sin él, el periodo no existe.
    source_exclusions:
      - file: "2014_sem01.pdf"
        diseases: [diabetes_t1, diabetes_t2]
        reason: "formato de cierre anual: sólo acumulados H/M/año anterior, sin columna Sem"
      - file: "2016_sem20.pdf"
        diseases: [diabetes_t2]
        keep_period: true              # semana interior: el runner exige series contiguas
        reason: >-
          bloques E01 y E11-E14 intercambiados y el de E11-E14 ajeno a la semana 19 (acum
          68,724/96,370 mayor que el de la semana 21); E10 sí es coherente
    n_states_expected: 32
    backend: camelot_stream

  enfermedades_cardiovasculares:
    # CUADRO 13 (continuación) "Enfermedades No Transmisibles": Hipertensión arterial I10-I15,
    # Enfermedad isquémica del corazón I20, I25 y Enfermedad cerebrovascular I60-I67, I69, en
    # 3 bloques de 4 columnas (Sem, Acum H, Acum M, Acum año anterior). Discovery del 7-nov-2026
    # sobre 669 boletines: la página existe en todos.
    page_anchors: ["hipertensi", "cerebrovascular"]
    state_markers: ["zacatecas", "tamaulipas"]
    year_week_source: filename
    observation_lag_weeks: 1           # igual que el resto del Cuadro 13
    diseases:
      - id: hipertension_i10
        keyword: "Hipertension_I10"
        block_index: 0
        onboard: true
      - id: isquemica_i20
        keyword: "Isquemica_I20"
        block_index: 1
        onboard: true
      - id: cerebrovascular_i60
        keyword: "Cerebrovascular_I60"
        block_index: 2
        onboard: true
    source_exclusions:
      - file: "2014_sem01.pdf"
        diseases: [hipertension_i10, isquemica_i20, cerebrovascular_i60]
        reason: "formato de cierre anual: sólo acumulados H/M/año anterior, sin columna Sem"
      - file: "2016_sem20.pdf"
        diseases: [hipertension_i10, isquemica_i20, cerebrovascular_i60]
        keep_period: true
        reason: "bloques rotados frente a los boletines vecinos: el acumulado salta y vuelve"
      - file: "2019_sem28.pdf"
        diseases: [hipertension_i10, isquemica_i20, cerebrovascular_i60]
        keep_period: true
        reason: "camelot pierde un renglón de entidad: 31 de 32"
    n_states_expected: 32
    backend: camelot_stream

  # ── Radar del boletín W42 (8-nov-2026): cinco padecimientos de alta incidencia. Discovery sobre
  # 669 boletines (2014_sem01..2026_sem42): la página existe en todos y el bloque objetivo es
  # siempre el primero o el último, de 4 columnas (Sem, Acum H, Acum M, Acum año anterior), aunque
  # el número de bloques vecinos cambia según el año. Todos dicen «hasta la semana N-1».
  infecciosas_digestivas_intestinales:
    # CUADRO 4.x: Infecciones intestinales por otros organismos y las mal definidas (A04, A08-A09
    # excepto A08.0), último bloque. 11 columnas hasta 2015_sem01, 12 hasta 2024_sem05 y 8 después.
    page_anchors: ["mal definidas"]
    state_markers: ["zacatecas", "tamaulipas"]
    year_week_source: filename
    observation_lag_weeks: 1
    last_block_columns: {8: 4, 11: 4, 12: 4}
    diseases:
      - id: intestinales_a04
        keyword: "Intestinales_A04"
        block_index: 0
        onboard: true
    source_exclusions:
      - file: "2014_sem01.pdf"
        diseases: [intestinales_a04]
        reason: "formato de cierre anual: sólo acumulados H/M/año anterior, sin columna Sem"
    layout_variants:
      - id: v_4col_prev
        min_year_week: "0000_sem00"
        cols_per_disease: 4
        has_prev_year: true
    n_states_expected: 32
    backend: camelot_stream

  infecciosas_respiratorias_agudas:
    # CUADRO 5.1: Infecciones respiratorias agudas (J00-J06, J20, J21 excepto J02, J03.0), primer
    # bloque. 8 columnas hasta 2020_sem07, 11 en 2020, 12 hasta 2024_sem06 y 8 después.
    page_anchors: ["respiratorias agudas"]
    state_markers: ["zacatecas", "tamaulipas"]
    year_week_source: filename
    observation_lag_weeks: 1
    first_block_columns: {8: 4, 11: 4, 12: 4}
    diseases:
      - id: ira_j00
        keyword: "IRA_J00"
