    state_markers: ["zacatecas", "tamaulipas"]
    year_week_source: filename
    observation_lag_weeks: 1           # «hasta la semana N-1» en el boletín N, en ambos cuadros
    inner_block_columns: {8: [4, 4], 11: [7, 4], 12: [8, 4]}
    periodos:
      - desde: "2024_sem07"
        inner_block_columns: null
        first_block_columns: {8: 4}
    diseases:
      - id: neumonias_j12
        keyword: "Neumonias_J12"
        block_index: 0
        onboard: true
    source_exclusions:
      - file: "2014_sem01.pdf"
        diseases: [neumonias_j12]
        reason: "formato de cierre anual: sólo acumulados H/M/año anterior, sin columna Sem"
    layout_variants:
