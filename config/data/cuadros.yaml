    reparaciones:
      # Reparación declarada por decisión nominal del autor (lote alta_b44, 19-nov-2026,
      # DECISIONES_AUTOR_3.json). Regla escrita en cuadro_reparacion_serie.py; registro por fila en
      # <slug>_reparaciones.csv y motivo por boletín en el manifiesto.
      - tipo: sem_desde_delta_acumulado
        diseases: [alacran_t63]
        desde: "2024_sem02"
        hasta: "2025_sem01"
        motivo: >-
          la fuente imprime en Sem. el acumulado del año H+M en los 52 boletines 2024_sem02..2025_sem01
          (periodos 2024-W01..W52): Sem == H+M en 1664/1664 filas estado-boletín y en el TOTAL
          (lote alta_b44, frag/c6/alacran_t63.qa.md)
    correcciones_celda:
      # Decisión nominal del autor (lote alta_b44, 19-nov-2026, DECISIONES_AUTOR_5.json): imputar
      # las 17 celdas estado-boletín de 14 boletines (2024_sem16..2025_sem01, objetivos 2024) donde
      # la fuente imprime un acumulado del año H+M menor que el del boletín previo, con lo que la
      # reparación declarada daría un negativo. Quedan con Casos_semana vacía (el dataset v2 las
      # imputa: total_imputed) y los acumulados impresos intactos. Aviso de nivel 2024: la serie
      # reparada suma Δ acumulado (incluye revisiones tardías) y queda por encima del nivel de Σ Sem.
      # de los demás años (frag/c4b/alacran_t63.qa.md, frag/c8/alacran_t63.qa.md).
