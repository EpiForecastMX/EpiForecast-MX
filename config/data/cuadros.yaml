    #   2015_sem02..2020_sem26: 4 + 3 + 4 = 11; mismo rótulo hasta 2017_sem01; desde 2017_sem02
    #     «Vulvovaginitis», CIE N76 (continuidad medida en QA: 2017 reexpresa 2016 al 99.4 %).
    #   2020_sem27..2026_sem43: SIDA pasa al Cuadro 6.3; 4 + 3 = 7 y Vulvovaginitis es el último.
