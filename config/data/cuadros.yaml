        block_index: 0
        onboard: true
    source_exclusions:
      - file: "2014_sem01.pdf"
        diseases: [sifilis_adquirida_a51]
        reason: >-
          boletín con corte hasta la semana epidemiológica 52 del 2013 (objetivo 2013-W52, con
          columna Sem=15 presente en Cuadro 6): anterior a series_start (2014-W01)
      - file: "2016_sem20.pdf"
        diseases: [sifilis_adquirida_a51]
        keep_period: true
        reason: >-
          bloques rotados frente a los boletines vecinos (verificado contra 2016_sem19 y 2016_sem21):
          imprime bajo Sífilis Adquirida cifras de Linfogranuloma Venéreo A55 (TOTAL Sem 1, Acum H 34,
          M 40, prev 79 frente a 67/757/449/1 245 en sem19 y 79/845/517/1 394 en sem21)
