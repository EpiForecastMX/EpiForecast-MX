  b44_vih_b20:
    # Cuadro 6.3 «Infección por el Virus de la Inmunodeficiencia Humana» (B20-B24, Z21), lote alta_b44.
    # Definición VIH desde 2020_sem28; hasta 2020_sem26 el boletín imprime SIDA (B20-B24, Cuadro 6.2)
    # y 2020_sem27 SIDA por estadios: otra definición, fuera de la serie por decisión del autor
    # (DECISIONES_AUTOR_3.json). Las anclas exigen «z21» y «estad», que sólo reúne la página de VIH
    # (medido con pypdf en los 671 boletines, qa/c2b/anclas_vih.json): los anteriores quedan sin
    # página. Bloque único por estadios clínicos 1-4 en pares H/M de acumulados del año, sin
    # acumulado por sexo impreso: 11 columnas en 2020_sem28..2024 (Sem, 8 de estadio, Sem y Acum. del
    # año anterior) y 10 desde 2025 (sin el Sem. del año anterior). ``estadios_por_sexo`` suma los
    # estadios de cada sexo y valida contra el TOTAL impreso. Rezago impreso 0 («hasta la semana N»
    # en el boletín N). En 2025-2026 camelot con row_tol=2 separa valores y nombres en dos renglones
    # (filas estatales vacías) en varios boletines: reintento_row_tol: 4, como Sífilis adquirida,
    # sólo cuando faltan entidades o quedan filas vacías, validado contra el TOTAL impreso.
