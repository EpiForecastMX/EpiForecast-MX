  - id: obesidad
    data_name: "Obesidad"
    artifact_key: Obesidad
    slug: obesidad
    display_name: "Obesidad"
    cie_codes: ["E66"]
    aliases: ["obesidad", "obeso", "obesa", "sobrepeso", "imc alto"]
    profile: obesidad_cronica
    batch: standalone
    extraction_group: trastornos_nutricion
    exposure_source_id: inegi_cpv2020_static   # EpiDatasetV2 lo EXIGE; el legacy puede omitirlo
    # configured -> trained -> published (cada flip es un gate). `trained` = C5 cerrado: selección
    # congelada, gate 2025 aceptado, 64 modelos finales y forecast preliminar reproducibles bajo
    # runs/. NO habilita publicación ni rutas canónicas: sigue invisible para published_only.
    # C7.7 (4-nov-2026): PUBLICADA con OK formal del autor. Validación prospectiva 4/4 PASS
    # (W27-W30) y observada hasta el boletín W42. Su paridad de corte se exige con los demás
    # publicados; sus artefactos legacy se sustituyen por el release sellado (revisa_releases).
    lifecycle: published
    # Canales públicos EXACTOS. Tableau queda FUERA por decisión del autor (requiere pasos
    # manuales de Sheets/Tableau Desktop); reincorporarlo NO mueve el `release_id`.
    channels: [web, epibot, reports]
    # C7.1: el carril nuevo NO entrenó DeepAR/Ensemble/Stacking. Vaciar estos campos legacy impide
    # que un PKL preliminar del carril viejo se haga pasar por artefacto de Obesidad. Los motores
    # reales viven en la política (candidatos) y en final_selection.csv (los 6 seleccionados).
    training_engines: []
    eligible_engines: []
    selection_policy: rolling_cv_v1
    # De dónde salen los modelos (C7.2-B): el RELEASE BUNDLE inmutable de su sede, no
    # models/<motor>/Obesidad/ ni runs/. `runs/` está gitignored y fuera de DVC, así que no era
    # recuperable por nadie más; el bundle sí tiene puntero DVC dedicado. El release lleva dentro
    # su propia cadena sellada (dataset/política/selección/aceptación/refit/forecast), por eso aquí
    # basta con su ID. `runner_release` es admisible con lifecycle=trained: NO habilita publicar.
    artifact_source:
      backend: runner_release
      release_id: obesidad_release_2517e7858901
    prophet_grid_key: null            # C7.1: no entrena Prophet legacy; el grid vive en el runner
    deepar_grid_key: null             # DeepAR-Obesidad usa escalares del bloque long-series (sin grid propio)
    aggregate_national: false
    # La galería es superficie pública: se enciende en la activación de C7.5, no antes.
    gallery_enabled: false
    web:
      color: "#D97706"                # ámbar (texto oscuro)
      label: "Obesidad"
      nombre_completo: "Obesidad (E66)"


