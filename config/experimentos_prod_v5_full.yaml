# config/experimentos_prod_v5_full.yaml
# PRODUCCIÓN v5 FINAL — 6 modelos × 3 padecimientos × 33 regiones × 3 sexos
# Con MASE, sin atípico_2016, Newton protection, umbral 0.5
# Estimado: ~10-12h en ml.g4dn.xlarge (~$10 USD)
# ~297 series × 6 modelos = ~1,782 trials (menos omitidas por umbral)

experimentos:
  nombre: epiforecast-prod-v5-full
  descripcion: Produccion final — 6 modelos, 3 sexos, MASE, sin atipico_2016

  transformacion:
    log_transform: true
    tasa_por: 100000
    columna_poblacion: Total

  # Solo COVID (atipico_2016 REMOVIDO — sin impacto medible en RMSE)
  periodos_atipicos:
    - holiday: pandemia_covid
      ds: "2020-03-23"
      lower_window: 0
      upper_window: 913

  cambios_regimen:
    - holiday: cambio_regimen_tabasco_2023
      ds: "2023-01-09"
      lower_window: 0
      upper_window: 365
      entidad: "Tabasco"
      padecimiento: "Depresión"

  modelos:
    prophet:
      activo: true
      cv_timeout_por_combo: 90
      cv_timeout_por_fold: 35
      umbral_minimo_semanal: 0.5
      fourier_order_regional: 3
      n_changepoints_regional: 12
      param_grid:
        seasonality_mode:
          - multiplicative
          - additive
        changepoint_prior_scale:
          - 0.01
          - 0.03
          - 0.05
        seasonality_prior_scale:
          - 0.1
          - 0.5
          - 1.0
        fourier_order:
          - 5

      grids_por_padecimiento:
        # Alzheimer: 1×2×3×1 = 6 combos
        Alzheimer:
          seasonality_mode:
            - multiplicative
          changepoint_prior_scale:
            - 0.01
            - 0.03
          seasonality_prior_scale:
            - 0.05
            - 0.1
            - 0.5
          fourier_order:
            - 5

        # Depresión: 2×3×4×1 = 24 combos
        Depresion:
          seasonality_mode:
            - additive
            - multiplicative
          changepoint_prior_scale:
            - 0.01
            - 0.03
            - 0.05
          seasonality_prior_scale:
            - 0.025
            - 0.05
            - 0.1
            - 0.5
          fourier_order:
            - 5

        # Parkinson: 2×3×3×1 = 18 combos
        Parkinson:
          seasonality_mode:
            - multiplicative
            - additive
          changepoint_prior_scale:
            - 0.03
            - 0.04
            - 0.05
          seasonality_prior_scale:
            - 0.1
            - 0.5
            - 1.0
          fourier_order:
            - 5

    xgboost:
      activo: true
      param_grid:
        n_estimators:
          - 100
        max_depth:
          - 5
        learning_rate:
          - 0.05
      features:
        lags: [1, 2, 4, 8, 12, 52]
        rolling_windows: [4, 12, 26]

    sarimax:
      activo: false

    ridge:
      activo: true
      param_grid:
        alpha:
          - 1.0
      features:
        lags: [1, 2, 4, 8, 12, 52]
        rolling_windows: [4, 12, 26]

    tft:
      activo: true
      param_grid:
        hidden_size:
          - 16
        learning_rate:
          - 0.01
        max_steps:
          - 100

    deepar:
      activo: true
      param_grid:
        hidden_size:
          - 32
        learning_rate:
          - 0.001
        max_steps:
          - 100

    lightgbm_lstm:
      activo: true
      param_grid:
        lgbm_n_estimators:
          - 300
        lgbm_max_depth:
          - 5
        ensemble_weight_lgbm:
          - 0.5
        lstm_max_steps:
          - 100
      features:
        lags: [1, 2, 4, 8, 12, 52]
        rolling_windows: [4, 12, 26]

    neuralprophet:
      activo: false

  scope:
    solo_regional: false
    padecimientos: []      # Todos (Depresión, Alzheimer, Parkinson)
    sexos:
      - incrementos_total
      - incrementos_hombres
      - incrementos_mujeres
    # Sin filtro regiones = 32 estados + Nacional

  cv:
    n_splits: 4
    test_size: 52
    fecha_corte: "2025-01-01"
    ponderar_folds: true
    pesos_folds:
      - 0.5
      - 0.75
      - 1.0
      - 1.25

  tracking:
    local: true
    sagemaker: false
    directorio_resultados: ./experiments

aws:
  sagemaker:
    role_arn: "arn:aws:iam::564141855321:role/SageMakerExecutionRole"
    region: us-east-1
    instance_type: ml.g4dn.xlarge
    instance_count: 1
    max_runtime_seconds: 64800    # 18h safety margin
    volume_size_gb: 50
    output_s3: "s3://epiforecast-mx-data/experiments/"
    ecr_repository: epiforecast-mx-training
    image_tag: latest
