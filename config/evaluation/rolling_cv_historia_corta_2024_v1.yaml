# Política de backtest OOS para series que EMPIEZAN EN 2023-W07..2024-W01: categorías que el boletín
# imprime como bloque propio sólo desde el cambio de cuadros de 2024 (arañas, abejas, avispas, otros
# artrópodos, otros animales ponzoñosos, serpientes de cascabel y coral) y «otras serpientes» (desde
# 2023-W07). Registrada el 19-nov-2026 por orden nominal del autor («Sí, política nueva»,
# planes/alta_b44_2026-11-19/DECISIONES_AUTOR_2.json), ANTES de abrir cualquier prueba de estas series.
#
# Con un solo año previo al pliegue de desarrollo, toda ventana estacional de varios años cae al naive
# (seasonal_mean_2y es idéntica a seasonal_naive_lag52 en 2025) y ETS/Ridge no tienen dos estaciones.
# No hay nada distinto que elegir: el ÚNICO candidato es el control `seasonal_naive_lag52`. Lo que esta
# política produce es, por construcción, el control estacional; nunca debe presentarse como un modelo
# validado ni como un portafolio que mejora al control.
#   - desarrollo: UN pliegue, 2025 completo (53 semanas MMWR), con 2024 como train (>= 52 semanas);
#   - prueba bloqueada: 2026-W01 a W43 (semanas observadas con el boletín 44), se abre una sola vez;
#   - regla de aceptación IDÉNTICA a las demás políticas (5 % bases y conjunto, 10 % nacional).
version: 1
name: rolling_cv_historia_corta_2024_v1

seed: 20260724
seasonal_horizon: 52
min_train_weeks: 52 # un año completo antes del pliegue de desarrollo
mase_seasonal_lag: 52
allow_53_week_development: true

series_start: {epi_year: 2024, epi_week: 1}

metrics:
  primary: smape
  reported: [smape, mase, mae, rmse, wape, bias]

candidate_engines:
  - seasonal_naive_lag52

folds:
  development:
    - {epi_year: 2025, n_weeks: 53}
  test: # bloqueado: 2026-W01..W43, sin participar en la selección
    - {epi_year: 2026, n_weeks: 43, partial: true}

selection:
  aggregate: median
  challenger_min_improvement_pct: 5.0 # sin efecto: no hay challengers
  band_pct: 5.0
  tie_break: [mase, rmse, cost, engine]
  tiers:
    incumbents:
      - seasonal_naive_lag52
    challengers: []
  cost:
    seasonal_naive_lag52: 1

acceptance:
  control_engine: seasonal_naive_lag52
  max_worse_pct:
    smape_bases: 5.0
    smape_all: 5.0
    smape_nacional_general: 10.0
  fallback_engine: seasonal_naive_lag52

stages:
  smoke: {fold_groups: [development], last_n_folds: 1}
  full: {fold_groups: [development]}
  test: {fold_groups: [test]} # 2026-W01..W43: se abre UNA sola vez, con selección congelada
