# config/experimentos.yaml
# Comparacion de modelos — actualizado con hallazgos CLAUDE.md (Feb 2026)

experimentos:
  nombre: epiforecast-comparacion
  descripcion: Comparacion de modelos para forecasting epidemiologico IMSS

  transformacion:
    log_transform: true
    tasa_por: 100000
    columna_poblacion: Total

  periodos_atipicos:
    - holiday: pandemia_covid
      ds: "2020-03-23"
      lower_window: 0
      upper_window: 913
    - holiday: atipico_2016
      ds: "2016-05-16"
      lower_window: 0
      upper_window: 182

  modelos:
    prophet:
      activo: true
      param_grid:
        # Grid base (fallback si no hay grid específico)
        seasonality_mode:
          - multiplicative
          - additive
        changepoint_prior_scale:
          - 0.01
          - 0.03
          - 0.05
        seasonality_prior_scale:
          - 0.1
          - 0.5
          - 1.0
        fourier_order:
          - 5
          - 10

      grids_por_padecimiento:
        # --- ALZHEIMER: grid estrecho, multiplicativo domina (77%) ---
        Alzheimer:
          seasonality_mode:
            - multiplicative              # ganador absoluto (77%)
          changepoint_prior_scale:
            - 0.005                       # NUEVO: explorar más suave
            - 0.01                        # ganador anterior
            - 0.03                        # 2° lugar
          seasonality_prior_scale:
            - 0.1                         # ganador (41%)
            - 0.5                         # 2° lugar (28%)
          fourier_order:
            - 5                           # ganador en 297 modelos
            - 10
          # Total: 1×3×2×2 = 12 combos

        # --- DEPRESIÓN: grid amplio, ambos modos competitivos ---
        Depresion:
          seasonality_mode:
            - additive                    # promedio mejor para Depresión (49.5%)
            - multiplicative              # competitivo en ciertos estados
          changepoint_prior_scale:
            - 0.01                        # dominante global (61%)
            - 0.03                        # no hay diferencia significativa
            - 0.05                        # ganador en estados volátiles
          seasonality_prior_scale:
            - 0.05                        # NUEVO: explorar más regularización
            - 0.1                         # ganador anterior
            - 0.5                         # 2° lugar
          fourier_order:
            - 5
            - 10
          # Total: 2×3×3×2 = 36 combos

        # --- PARKINSON: intermedio, cp bajo, multiplicativo domina (72%) ---
        Parkinson:
          seasonality_mode:
            - additive
            - multiplicative
          changepoint_prior_scale:
            - 0.005                       # NUEVO: explorar más suave
            - 0.01                        # ganador absoluto (62%)
          seasonality_prior_scale:
            - 0.1                         # ganador (40%)
            - 0.5                         # 2° lugar
            - 1.0                         # 3° lugar
          fourier_order:
            - 5                           # ganador en 297 modelos
            - 10
          # Total: 2×2×3×2 = 24 combos

    xgboost:
      activo: false  # Solo Prophet para esta corrida
      param_grid:
        n_estimators:
          - 100
        max_depth:
          - 5
        learning_rate:
          - 0.05
      features:
        lags: [1, 2, 4, 8, 12, 52]
        rolling_windows: [4, 12, 26]

    sarimax:
      activo: false
      param_grid:
        order:
          - [1, 1, 1]
          - [2, 1, 1]
          - [1, 1, 2]
        seasonal_order:
          - [1, 1, 1, 52]
          - [0, 1, 1, 52]

    ridge:
      activo: false  # Solo Prophet para esta corrida
      param_grid:
        alpha:
          - 1.0
      features:
        lags:
          - 1
          - 2
          - 4
          - 8
          - 12
          - 52
        rolling_windows:
          - 4
          - 12
          - 26

    tft:
      activo: false  # Solo Prophet para esta corrida
      param_grid:
        hidden_size:
          - 16
        learning_rate:
          - 0.01
        max_steps:
          - 100

    deepar:
      activo: false  # Solo Prophet para esta corrida
      param_grid:
        hidden_size:
          - 32
        learning_rate:
          - 0.001
        max_steps:
          - 100

    lightgbm_lstm:
      activo: false  # Solo Prophet para esta corrida
      param_grid:
        lgbm_n_estimators:
          - 300
        lgbm_max_depth:
          - 5
        ensemble_weight_lgbm:
          - 0.5
        lstm_max_steps:
          - 100
      features:
        lags:
          - 1
          - 2
          - 4
          - 8
          - 12
          - 52
        rolling_windows:
          - 4
          - 12
          - 26

    neuralprophet:
      activo: false  # DESACTIVADO: conflicto pytorch-lightning con neuralforecast
      param_grid:
        n_lags:
          - 52
        learning_rate:
          - 0.1
        epochs:
          - 50
        n_changepoints:
          - 10
        ar_layers:
          - [16]

  scope:
    solo_regional: true
    padecimientos: []  # Vacío = todos (Depresión, Alzheimer, Parkinson)
    sexos:
      - incrementos_total
    max_regiones: 1    # Solo Aguascalientes (primera región alfabéticamente)

  cv:
    n_splits: 4
    test_size: 52
    fecha_corte: "2025-01-01"
    ponderar_folds: true
    pesos_folds:
      - 0.5
      - 0.75
      - 1.0
      - 1.25

  tracking:
    local: true
    sagemaker: false
    directorio_resultados: ./experiments

aws:
  sagemaker:
    role_arn: "arn:aws:iam::564141855321:role/SageMakerExecutionRole"
    region: us-east-1
    instance_type: ml.m5.xlarge  # CPU para prueba ligera (~$0.23/hr). Full run: ml.g4dn.xlarge
    instance_count: 1
    max_runtime_seconds: 86400
    volume_size_gb: 50
    output_s3: "s3://epiforecast-mx-data/experiments/"
    ecr_repository: epiforecast-mx-training
    image_tag: latest
