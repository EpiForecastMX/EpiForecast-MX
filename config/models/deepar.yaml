# Configuración para DeepAR (GluonTS + PyTorch, entrenamiento local en CPU)

deepar:
  epochs: 100
  context_length: 52             # Un año de historia para el contexto
  prediction_length: 52          # Un año de predicción (horizonte)
  num_layers: 2                  # Número de capas recurrentes
  num_cells: 40                  # Celdas por capa (RNN)
  dropout_rate: 0.1              # Regularización
  learning_rate: 1e-3
  batch_size: 32
  scaling: true                  # Normalización interna de GluonTS
  distr_output: "negative-binomial"  # Distribución para datos de conteo
  num_samples: 200               # Muestras Monte Carlo para intervalos de confianza
  freq: "W-MON"                  # Frecuencia de la serie temporal

# Hiperparámetros específicos por padecimiento
param_grid_deepar:
  alzheimer:
    epochs: [50, 100]
    num_layers: [2, 3]
  depresion:
    epochs: [100, 150]
    num_layers: [2, 3]
  parkinson:
    epochs: [50, 100]
    num_layers: [2]
