# Configuración para AWS DeepAR (SageMaker / GluonTS)
# Estos parámetros controlan el comportamiento del modelo de Deep Learning

# Configuración del modelo
epochs: 100
context_length: 52             # Un año de historia para el contexto
prediction_length: 52          # Un año de predicción (horizonte)
num_layers: 2                  # Número de capas recurrentes
num_cells: 40                  # Celdas por capa (RNN)
dropout_rate: 0.1              # Regularización
learning_rate: 1e-3
batch_size: 32

# Configuración del entrenamiento en AWS (si se usa SageMaker)
instance_type: "ml.m5.xlarge"
instance_count: 1

# Hiperparámetros específicos por padecimiento (similar a prophet.yaml)
param_grid_deepar:
  alzheimer:
    epochs: [50, 100]
    num_layers: [2, 3]
  depresion:
    epochs: [100, 150]
    num_layers: [2, 3]
  parkinson:
    epochs: [50, 100]
    num_layers: [2]
