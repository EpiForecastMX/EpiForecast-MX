# .github/workflows/scrape_boletines.yml
#
# Scraper automatizado de boletines SINAVE para EpiForecast-MX.
# Corre martes a jueves a las 2 PM hora CDMX (20:00 UTC).
# Tambien se puede correr manualmente desde Actions.
#
# Flujo:
#   1. Scraper detecta y descarga boletines nuevos a data/raw_PDFs/
#   2. Si hay nuevos: dvc pull → restaura PDFs existentes →
#      mueve nuevos de vuelta → dvc add → dvc push
#   3. Git commit: registry.json + raw_PDFs.dvc
#
# Secrets requeridos en GitHub:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   SNS_TOPIC_ARN       (opcional)

name: Scrape Boletines SINAVE

on:
  schedule:
    # Martes a jueves, 20:00 UTC (2 PM CDMX). El boletin SINAVE se publica a mitad de semana,
    # asi que no tiene sentido raspar los 7 dias. (cron dia-de-semana: 2=mar, 3=mie, 4=jue)
    - cron: "0 20 * * 2-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pip install selenium requests boto3

      - name: Install xvfb (display virtual para Chrome no-headless)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Fase 1: Scraper detecta y descarga nuevos ──
      - name: Run scraper
        id: scraper
        env:
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SCRAPER_HEADLESS: "0"   # Chrome no-headless bajo xvfb pasa mejor el muro anti-bot de gob.mx
        run: |
          xvfb-run -a python scripts/scrape_boletines.py
          if [ -f /tmp/sinave_new_files.txt ]; then
            NEW_COUNT=$(grep -c . /tmp/sinave_new_files.txt || echo "0")
            echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Subir diagnostico si el scraper falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-diagnostico
          path: |
            /tmp/sinave_page.html
            /tmp/sinave_page.png
          if-no-files-found: ignore
          retention-days: 7

      # ── Fase 2: DVC (solo si hay boletines nuevos) ──
      - name: Install DVC
        if: steps.scraper.outputs.new_count != '0'
        run: pip install dvc[s3]

      - name: Stash new PDFs + DVC pull
        if: steps.scraper.outputs.new_count != '0'
        run: |
          # Debug: mostrar contenido del flag file
          echo "=== Flag file contents ==="
          cat -A /tmp/sinave_new_files.txt
          echo "=== End flag file ==="

          # Mover PDFs recien descargados a /tmp para que dvc pull no los borre
          mkdir -p /tmp/stash_pdfs
          for fname in $(cat /tmp/sinave_new_files.txt); do
            if [ -f "data/raw_PDFs/$fname" ]; then
              mv "data/raw_PDFs/$fname" /tmp/stash_pdfs/
              echo "Stashed: $fname"
            else
              echo "WARNING: no encontrado data/raw_PDFs/$fname"
            fi
          done
          echo "Stashed $(ls /tmp/stash_pdfs/ | wc -l) new PDF(s)"

          # Restaurar todos los PDFs existentes desde DVC
          dvc pull --force
          echo "DVC pull complete: $(ls data/raw_PDFs/ | wc -l) existing PDF(s)"

      - name: Restore new PDFs + DVC add/push
        if: steps.scraper.outputs.new_count != '0'
        run: |
          # Copiar PDFs nuevos de vuelta a la carpeta versionada
          cp /tmp/stash_pdfs/*.pdf data/raw_PDFs/
          echo "Total PDFs: $(ls data/raw_PDFs/ | wc -l)"

          # Re-trackear con DVC y subir solo los nuevos
          dvc add data/raw_PDFs
          dvc push

      # ── Fase 3: Git commit (siempre, por si registry cambio) ──
      - name: Commit changes
        run: |
          git config user.name "Javier Rebull"
          git config user.email "168046724+jrebull@users.noreply.github.com"

          # Debug: mostrar estado de archivos
          echo "=== Git status ==="
          git status --short

          # Agregar archivos explícitamente
          git add -f data/registry.json

          # Agregar .dvc solo si existe
          if [ -f data/raw_PDFs.dvc ]; then
            echo "Adding raw_PDFs.dvc"
            git add data/raw_PDFs.dvc
          fi

          # Agregar .gitignore de data si existe
          if [ -f data/.gitignore ]; then
            echo "Adding data/.gitignore"
            git add data/.gitignore
          fi

          echo "=== Staged files ==="
          git diff --staged --name-only

          git diff --staged --quiet || git commit -m "chore(data): actualizado $(date +%Y-%m-%d)"
          git push
