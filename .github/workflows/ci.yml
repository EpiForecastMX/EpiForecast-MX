# .github/workflows/ci.yml
# EpiForecast-MX — Continuous Integration
#
# Triggers: push to main/refactor/*, PR to main
# Jobs: quality → test → integration (manual only)
#
# Uses a venv to isolate from runner pre-installed packages,
# avoiding version mismatches (e.g. urllib3/requests).

name: CI

on:
  push:
    branches: [main, "refactor/*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # lunes 06:00 UTC — integration tests semanales
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  C7_SCRIPTS: >-
    scripts/prospective_week.py
    scripts/prospective_status.py
    scripts/publication_readiness.py
    scripts/tableau_workbook.py

jobs:
  quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create isolated venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check src/epiforecast/ tests/ scripts/run_isolated_pytest.py $C7_SCRIPTS

      - name: Format check (ruff format)
        run: ruff format --check src/epiforecast/ tests/ scripts/run_isolated_pytest.py $C7_SCRIPTS

      - name: Type check (mypy)
        run: |
          mypy src/epiforecast/
          mypy scripts/run_isolated_pytest.py
          for script in $C7_SCRIPTS; do
            mypy "$script"
          done

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps
        run: sudo apt-get install -y ghostscript

      - name: Create isolated venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests + coverage
        run: pytest tests/ -v --tb=short -m "not slow and not integration" --cov-fail-under=70 --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps
        run: sudo apt-get install -y ghostscript

      - name: Create isolated venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=long -m integration
        env:
          AWS_DEFAULT_REGION: us-east-1
