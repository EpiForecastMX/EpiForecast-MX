# .github/workflows/ci.yml
# EpiForecast-MX — Continuous Integration
#
# Triggers: push to main/refactor/*, PR to main, cron de los lunes
# Jobs: quality → test  (siempre)  ·  integration  (SOLO workflow_dispatch)
#
# El cron de los lunes ejecuta quality y test. `integration` NO corre en el
# schedule: es el carril legacy, exige la cadena sellada de runs/ (gitignored)
# y en un runner limpio se salta el 87% de sus pruebas. Se deja como ejecucion
# MANUAL para no reportar verde una integracion que no se comprueba. Aparecera
# como omitido en las corridas programadas: eso es el estado honesto.
#
# Uses a venv to isolate from runner pre-installed packages,
# avoiding version mismatches (e.g. urllib3/requests).

name: CI

on:
  push:
    branches: [main, "refactor/*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # lunes 06:00 UTC — quality + test (integration NO)
  workflow_dispatch:

# Mínimo privilegio: el CI sólo lee el repositorio y sube artefactos.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Sólo se cancelan las PR superadas: cada push a main conserva su CI y el cron nunca se corta.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  C7_SCRIPTS: >-
    scripts/prospective_week.py
    scripts/prospective_status.py
    scripts/publication_readiness.py
    scripts/publication_activate.py
    scripts/publication_view.py
    scripts/tableau_workbook.py

jobs:
  quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create isolated venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dependency consistency (pip check)
        # Un entorno con requisitos rotos puede pasar las pruebas y fallar en otro paso
        # (así quedó DVC inservible en el venv local con botocore 1.43).
        run: pip check

      - name: Lint (ruff check)
        run: ruff check src/epiforecast/ tests/ scripts/run_isolated_pytest.py $C7_SCRIPTS

      - name: Format check (ruff format)
        run: ruff format --check src/epiforecast/ tests/ scripts/run_isolated_pytest.py $C7_SCRIPTS

      - name: Type check (mypy)
        run: |
          mypy src/epiforecast/
          mypy scripts/run_isolated_pytest.py
          for script in $C7_SCRIPTS; do
            mypy "$script"
          done

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps
        # `poppler-utils` trae `pdftotext`, que usan las cinco pruebas del bundle de MICAI
        # para leer el PDF entregado. Sin el fallaban con FileNotFoundError desde que el
        # camera-ready entro a main (PR #6). NO se saltan cuando falta la herramienta: una
        # comprobacion que no se puede correr no es una comprobacion que pasa.
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils

      - name: Create isolated venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,scraping]"

      - name: Dependency consistency (pip check)
        # Un entorno con requisitos rotos puede pasar las pruebas y fallar en otro paso
        # (así quedó DVC inservible en el venv local con botocore 1.43).
        run: pip check

      - name: Tests + coverage
        # Baseline Ubuntu tras mover los cuatro agregados legacy: 501 - 4 = 497.
        # Un skip nuevo es una regresión y vuelve rojo el job.
        # `python -m` conserva el checkout en sys.path durante el preparse y permite
        # cargar el plugin local antes de la colección; el console script `pytest` no
        # ofrece esa garantía.
        run: >-
          python -m pytest tests/ -v --tb=short -m "not slow and not integration"
          -p tests.skip_budget --max-skips=497
          --cov=src/epiforecast --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Carril legacy: solo a mano. Ver la cabecera del archivo.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps
        # `poppler-utils` trae `pdftotext`, que usan las cinco pruebas del bundle de MICAI
        # para leer el PDF entregado. Sin el fallaban con FileNotFoundError desde que el
        # camera-ready entro a main (PR #6). NO se saltan cuando falta la herramienta: una
        # comprobacion que no se puede correr no es una comprobacion que pasa.
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils

      - name: Create isolated venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,scraping]"

      - name: Run integration tests
        # Incluye los cuatro agregados legacy: si no fueron restaurados, sus checks
        # fallan. En este carril ausencia no equivale a una integración aprobada.
        run: pytest tests/integration/ -v --tb=long -m integration
        env:
          AWS_DEFAULT_REGION: us-east-1
