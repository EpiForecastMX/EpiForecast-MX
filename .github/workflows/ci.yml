# .github/workflows/ci.yml
# EpiForecast-MX — Continuous Integration
#
# Triggers: push/PR to main and develop
# Jobs: lint → typecheck → test (Python 3.12)
#
# Coverage threshold (--cov-fail-under) is defined HERE only,
# not in pyproject.toml, to keep a single source of truth.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: "Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install system deps
        run: sudo apt-get install -y ghostscript

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/epiforecast/ tests/

      - name: Ruff format check
        run: ruff format --check src/epiforecast/ tests/

      - name: Mypy
        run: mypy src/epiforecast/

      - name: Tests + coverage
        run: pytest tests/ --tb=short -q --cov-fail-under=80
