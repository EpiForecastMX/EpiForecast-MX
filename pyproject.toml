[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "epiforecast-mx"
version = "0.0.1"
description = "Sistema de pronóstico epidemiológico para Depresión (F32), Parkinson (G20) y Alzheimer (G30) en México, desarrollado en colaboración con el IMSS."
authors = [
  { name = "ITESM" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

