[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "epiforecast-mx"
version = "2.0.0"
description = "Sistema de pronóstico epidemiológico para Depresión (F32), Parkinson (G20) y Alzheimer (G30) en México, desarrollado en colaboración con el IMSS."
authors = [
  { name = "Javier Augusto Rebull Saucedo" },
  { name = "Juan Carlos Pérez Nava" },
  { name = "Luis Gerardo Sánchez Salazar" },
]
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = "~=3.12.0"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "prophet>=1.1",
    "cmdstanpy>=1.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "kaleido>=0.2",
    "omegaconf>=2.3",
    "loguru>=0.7",
    "camelot-py[cv]>=0.11",
    "pypdf>=4.0",
    "reportlab>=4.1",
    "rich>=13.7",
    "openpyxl>=3.1",
    "requests>=2.31",
    "boto3>=1.34",
    "dvc[s3]>=3.40",
    "pydantic>=2.6",
    "gluonts[torch]>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff==0.14.10",
    "mypy>=1.8",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "pre-commit>=3.6",
    "ipykernel>=6.29",
]
extraction = [
    "camelot-py[cv]>=0.11",
    "opencv-python-headless>=4.9",
    "pypdf>=4.0",
    "pandas>=2.2",
    "boto3>=1.34",
]
gsheets = [
    "gspread>=6.0",
    "google-auth>=2.0",
    "pandas>=2.2",
]
sagemaker = [
    "sagemaker>=2.200",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "torch>=2.2",
]

[project.scripts]
epiforecast = "scripts.train:main"

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = [
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default arg (needed for DI)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "epiforecast"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["ERA"]
"tests/*" = ["B011", "PTH113", "PTH119", "N806", "SIM117", "RET504", "F841"]
"src/epiforecast/data/extraction/*" = ["PTH103", "PTH110", "PTH112", "PTH118", "PTH122", "PTH123", "PTH208", "B007", "B018", "B904", "F841", "N803", "SIM102"]
"src/epiforecast/data/ingestion/*" = ["B023", "B905"]
"src/epiforecast/data/preprocessing/transformer.py" = ["B023", "B905", "ERA001", "N801"]
"scripts/*" = ["PTH118", "PTH123", "SIM102"]
"src/epiforecast/data/preprocessing/imputation.py" = ["B023", "B905", "ERA001", "N801"]
"src/epiforecast/visualization/base.py" = ["PTH118", "B905", "N806", "B024"]
"src/epiforecast/visualization/forecast_chart.py" = ["PTH118", "N806"]
"src/epiforecast/visualization/series_plots.py" = ["PTH118"]
"src/epiforecast/visualization/eda_plots.py" = ["E701"]
"src/epiforecast/visualization/inegi_plots.py" = ["E741"]
"src/epiforecast/visualization/reporters.py" = ["PTH110"]
"src/epiforecast/utils/config.py" = ["N816"]
"src/epiforecast/utils/dataframe_helpers.py" = ["N805"]

# ─── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false          # gradual — flip to true once migrated
ignore_missing_imports = true          # needed until all stubs exist
exclude = ["notebooks/", "docs/"]

[[tool.mypy.overrides]]
module = "epiforecast.*"
disallow_untyped_defs = false          # flip to true per-module as you refactor

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src/epiforecast",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::pyparsing.PyparsingDeprecationWarning",
    "ignore::DeprecationWarning:matplotlib",
    # requests 2.32 no reconoce urllib3 2.6 en su version check (cosmético, terceros)
    "ignore:urllib3.*or chardet.*doesn.t match a supported version:Warning",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/epiforecast"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

# ─── Flit ─────────────────────────────────────────────────────────────────────
[tool.flit.module]
name = "epiforecast"
